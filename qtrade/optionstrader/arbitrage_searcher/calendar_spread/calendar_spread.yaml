# Calendar Spread Arbitrage Search Configuration
# 基于历史回测经验的简化配置

# ============================================================================
# CORE SEARCH CRITERIA - 核心搜索条件
# ============================================================================

# IV Term Structure Inversion Required - IV期限结构倒挂要求
iv_criteria:
  min_iv_spread: 0.02                    # 最小IV价差：short_term_iv > long_term_iv + 2%
  iv_spread_threshold_pct: 0.02          # IV价差阈值百分比（2%）

# Strike Selection - 执行价选择
strike_criteria:
  atm_tolerance_pct: 0.03                # ATM容忍度：±3% of spot price
  # abs(strike_price - spot_price) / spot_price <= 3%

# Time Pairings - 时间配对
time_pairings:
  valid_combinations:
    - short_days: 7                      # 7天短期期权
      long_days: 30                      # 1个月长期期权
    
    - short_days: 7
      long_days: 45 
      
    - short_days: 14                     # 14天短期期权  
      long_days: 30                      # 1个月长期期权
      
    - short_days: 14                     # 14天短期期权
      long_days: 60                      # 2个月长期期权
      
    - short_days: 14                     # 14天短期期权
      long_days: 90                      # 3个月长期期权

  time_tolerance_days: 10                 # 时间容忍度：±3天

# ============================================================================
# MARKET DATA FILTERS - 市场数据筛选
# ============================================================================

market_filters:
  # 流动性要求
  liquidity:
    min_bid_price: 0.001                 # 最小买价（避免无流动性期权）
    max_bid_ask_spread_pct: 0.20         # 最大买卖价差百分比（20%）
    min_open_interest: 5                 # 最小持仓量
  
  # 价格合理性
  price_sanity:
    min_option_price: 0.0005             # 最小期权价格
    max_option_price: 0.5000             # 最大期权价格
    max_iv: 2.0                          # 最大IV（200%，避免异常数据）

# ============================================================================
# SEARCH PARAMETERS - 搜索参数
# ============================================================================

search_config:
  # 数据源
  data_source: "deribit"                     # 数据源：okx 或 deribit
  
  # 搜索范围
  currencies: ["BTC"]                    # 搜索币种
  option_types: ["C", "P"]               # 期权类型：C=Call, P=Put
  
  # 结果控制
  max_results: 10                        # 最大返回结果数
  sort_by: "iv_spread"                   # 排序方式：iv_spread, profit_potential
  sort_order: "desc"                     # 排序顺序：desc=降序, asc=升序

# ============================================================================
# PROFIT ESTIMATION - 盈利估算（可选）
# ============================================================================

profit_estimation:
  enable: true                           # 是否启用盈利估算                  # 最大风险比例（20%）

